[pytest]
# Configuración común de la suite.
#
# `timeout` corta una prueba colgada en lugar de dejar el CI bloqueado hasta
# el límite del job. El valor es holgado: la prueba más lenta ronda 2 s.
testpaths = tests
timeout = 120
timeout_method = thread
addopts = --strict-markers

# Ruido de dependencias de terceros que no controlamos.
filterwarnings =
    ignore:tagMap is deprecated
    ignore:typeMap is deprecated
