# Configuración de mypy para Ansible Control Center.
#
# Se comprueba solo el código de producción (app, config, acc, models y
# services). Las pruebas y las herramientas no forman parte del contrato de
# tipos: usan dobles y utilidades de terceros sin stubs.
#
# Ejecución: python -m mypy   (sin argumentos, usa esta configuración)
[mypy]
python_version = 3.11
files = app.py, config.py, acc, models, services
exclude = (?x)(^\.venv/|^instance/|^dist/)
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
show_error_codes = True
pretty = False

# Dependencias sin marcador py.typed: se aceptan sin tipos en lugar de
# silenciar todo el proyecto con ignore_missing_imports global.
[mypy-flask_login.*]
ignore_missing_imports = True

[mypy-ldap3.*]
ignore_missing_imports = True
