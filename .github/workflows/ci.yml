name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar VERSION y tag
        run: |
          python - <<'PY'
          import pathlib
          import re

          raw = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", raw):
              raise SystemExit(f"VERSION no es SemVer: {raw!r}")
          print(f"VERSION: {raw}")
          PY
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || {
              echo "El tag ${GITHUB_REF_NAME} no coincide con VERSION=$(cat VERSION)"
              exit 1
            }
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Las versiones de las herramientas están fijadas en requirements-dev.txt:
      # una versión distinta de black reformatea el repositorio entero y una de
      # mypy cambia el contrato de tipos. El objetivo es que local y CI fallen
      # exactamente por lo mismo. requirements-dev.txt incluye las dependencias
      # de ejecución y de pruebas.
      - name: Instalar dependencias y herramientas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Black (solo comprobación)
        run: python -m black --check .

      - name: Mypy
        run: python -m mypy

      # Solo código de producción: las herramientas y las pruebas usan
      # patrones (subprocess, urlopen) que no aplican al artefacto desplegado.
      # -ll limita el fallo a severidad media o alta.
      - name: Bandit (código de producción)
        run: python -m bandit -q -r app.py config.py acc models services -ll

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 es la versión de la imagen Docker; 3.13/3.14 comprueban que el
        # código no depende de una versión concreta. 3.11 queda fuera porque
        # la imagen y el mypy de referencia usan 3.12.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Comprobar sintaxis
        run: python -m compileall -q app.py config.py acc models services tests tools

      - name: Gate de calidad
        run: python tools/quality_check.py

      - name: Validar YAML de Ansible
        run: |
          python - <<'PY'
          import glob
          import yaml

          for path in glob.glob("ansible/**/*.yml", recursive=True):
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"{path}: OK")
          PY

      # El umbral sube con la cobertura real (81 %): así una regresión grande
      # falla en la pull request. pytest.ini aplica timeout por prueba.
      - name: Ejecutar pruebas
        run: |
          python -m pytest -q \
            --cov=app --cov=acc --cov=config --cov=models --cov=services \
            --cov-report=term-missing --cov-fail-under=78

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Instalar versiones fijadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install pip-audit
          python -m pip check

      # Audita el entorno de ejecución instalado desde el lock, que es el que
      # acaba en la imagen. Las herramientas de pruebas no se auditan aquí.
      - name: Auditar dependencias (SCA)
        run: python tools/audit_dependencies.py

  build:
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4

      # Construye las dos imágenes sin publicarlas. Detecta que el Dockerfile
      # y el lock siguen siendo instalables antes de empaquetar una release.
      - name: Construir imagen de la aplicación
        run: |
          docker build \
            --build-arg APP_VERSION="$(cat VERSION)" \
            --build-arg APP_COMMIT="${GITHUB_SHA}" \
            -t ansible-control-center:ci .

      - name: Construir imagen de Nginx
        run: |
          docker build \
            --build-arg APP_VERSION="$(cat VERSION)" \
            --build-arg APP_COMMIT="${GITHUB_SHA}" \
            -t ansible-control-center-nginx:ci docker/nginx
