name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar VERSION y tag
        run: |
          python - <<'PY'
          import pathlib
          import re

          raw = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", raw):
              raise SystemExit(f"VERSION no es SemVer: {raw!r}")
          print(f"VERSION: {raw}")
          PY
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || {
              echo "El tag ${GITHUB_REF_NAME} no coincide con VERSION=$(cat VERSION)"
              exit 1
            }
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Comprobar sintaxis
        run: python -m compileall -q app.py config.py acc models services tests tools

      - name: Gate de calidad
        run: python tools/quality_check.py

      - name: Auditar dependencias (SCA)
        run: python tools/audit_dependencies.py

      - name: Validar YAML de Ansible
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import glob
          import yaml

          for path in glob.glob("ansible/**/*.yml", recursive=True):
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"{path}: OK")
          PY

      - name: Ejecutar pruebas
        run: |
          python -m pytest -q \
            --cov=app --cov=acc --cov=config --cov=models --cov=services \
            --cov-report=term-missing --cov-fail-under=55

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Instalar versiones fijadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check
