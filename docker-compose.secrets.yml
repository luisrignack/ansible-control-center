# Secretos por fichero para Docker Compose (sin Swarm).
#
# Uso recomendado en producción:
#
#   ./docker/generate-secrets.sh          # crea secrets.d/ con permisos 0700
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Cada secreto se monta en /run/secrets/<nombre> y la aplicación lo lee con
# las variables *_FILE ya soportadas por config.py. Así la contraseña no
# aparece en `docker inspect`, en `ps` ni en los logs del arranque.
#
# Los ficheros viven en ./secrets.d (ignorado por git y por .dockerignore).
# Funciona sin conexión: no descarga nada ni consulta ningún servicio externo.

services:
  app:
    secrets:
      - acc_secret_key
      - acc_admin_password
      - acc_ldap_bind_password
    environment:
      # El valor directo se vacía a propósito: si estuviera definido, tendría
      # prioridad sobre el fichero y volvería a ser visible en `docker inspect`.
      ACC_SECRET_KEY: ""
      ACC_SECRET_KEY_FILE: /run/secrets/acc_secret_key
      ACC_ADMIN_PASSWORD: ""
      ACC_ADMIN_PASSWORD_FILE: /run/secrets/acc_admin_password
      ACC_LDAP_BIND_PASSWORD: ""
      ACC_LDAP_BIND_PASSWORD_FILE: /run/secrets/acc_ldap_bind_password

  # El planificador reutiliza la misma configuración: necesita la clave de
  # sesión y, si LDAP está activo, la contraseña del bind.
  scheduler:
    secrets:
      - acc_secret_key
      - acc_admin_password
      - acc_ldap_bind_password
    environment:
      ACC_SECRET_KEY: ""
      ACC_SECRET_KEY_FILE: /run/secrets/acc_secret_key
      ACC_ADMIN_PASSWORD: ""
      ACC_ADMIN_PASSWORD_FILE: /run/secrets/acc_admin_password
      ACC_LDAP_BIND_PASSWORD: ""
      ACC_LDAP_BIND_PASSWORD_FILE: /run/secrets/acc_ldap_bind_password

secrets:
  acc_secret_key:
    file: ${ACC_SECRETS_FILES_DIR:-./secrets.d}/acc_secret_key
  acc_admin_password:
    file: ${ACC_SECRETS_FILES_DIR:-./secrets.d}/acc_admin_password
  acc_ldap_bind_password:
    file: ${ACC_SECRETS_FILES_DIR:-./secrets.d}/acc_ldap_bind_password
