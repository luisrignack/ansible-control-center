name: hora-admin

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ansible-control-center:latest
    restart: unless-stopped
    # La app no necesita privilegios: corre como ``acc`` y solo abre el 8000.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ACC_DATA_DIR: /data
      ACC_SECRETS_DIR: /secrets
      ACC_LOG_DIR: /logs
      # En producción exige allowlist, clave de sesión y verificación SSH.
      ACC_ENV: "${ACC_ENV:-production}"
      # Rol del proceso: con ACC_ROLE=web el scheduler se ejecuta aparte con
      # `flask --app app scheduler` (ACC_ROLE=worker).
      ACC_ROLE: "${ACC_ROLE:-all}"
      ACC_SCHEDULER_ENABLED: "${ACC_SCHEDULER_ENABLED:-1}"
      ACC_RECOVERY_STALE_MINUTES: "${ACC_RECOVERY_STALE_MINUTES:-15}"
      # Detrás de Nginx: cookies Secure, IP real y proto HTTPS.
      ACC_COOKIE_SECURE: "1"
      ACC_TRUST_PROXY: "1"
      # HSTS se deja desactivado mientras el certificado sea autofirmado.
      ACC_HSTS: "${ACC_HSTS:-0}"
      ACC_SECRET_KEY: "${ACC_SECRET_KEY:-}"
      ACC_ADMIN_USERNAME: "${ACC_ADMIN_USERNAME:-admin}"
      ACC_ADMIN_PASSWORD: "${ACC_ADMIN_PASSWORD:-}"
      ACC_DRY_RUN: "${ACC_DRY_RUN:-1}"
      ACC_HOST_KEY_CHECKING: "${ACC_HOST_KEY_CHECKING:-1}"
      # Aprovisiona known_hosts con ssh-keyscan antes de cada lote. Desactivado
      # por defecto: aceptar la huella del primer contacto debilita TOFU. Para
      # laboratorio o primera instalación controlada usa el perfil
      # docker-compose.lab.yml o activa ACC_SSH_HOST_KEYS_AUTO=1 a conciencia.
      ACC_SSH_HOST_KEYS_AUTO: "${ACC_SSH_HOST_KEYS_AUTO:-0}"
      # Ruta alternativa de known_hosts (vacío = /home/acc/.ssh/known_hosts).
      ACC_KNOWN_HOSTS_FILE: "${ACC_KNOWN_HOSTS_FILE:-}"
      ACC_ALLOWED_NETWORKS: "${ACC_ALLOWED_NETWORKS:-}"
      ACC_MAX_PASSWORD_ATTEMPTS: "${ACC_MAX_PASSWORD_ATTEMPTS:-3}"
      ACC_BATCH_TIME_BUDGET: "${ACC_BATCH_TIME_BUDGET:-3600}"
      # Hosts en paralelo por lote y cupo global de playbooks simultáneos.
      ACC_BATCH_HOST_CONCURRENCY: "${ACC_BATCH_HOST_CONCURRENCY:-4}"
      ACC_GLOBAL_HOST_CONCURRENCY: "${ACC_GLOBAL_HOST_CONCURRENCY:-8}"
      ACC_MAX_HOSTS: "${ACC_MAX_HOSTS:-256}"
      ACC_PLAYBOOK_TIMEOUT: "${ACC_PLAYBOOK_TIMEOUT:-300}"
      ACC_APPROVAL_TTL_MINUTES: "${ACC_APPROVAL_TTL_MINUTES:-30}"
      # Verificación de hora y política NTP.
      ACC_TIME_TOLERANCE: "${ACC_TIME_TOLERANCE:-2}"
      ACC_TIME_REQUIRE_NTP_OFF: "${ACC_TIME_REQUIRE_NTP_OFF:-1}"
      ACC_NTP_SETTLE_SECONDS: "${ACC_NTP_SETTLE_SECONDS:-3}"
      # Estaciones Windows (WinRM).
      ACC_WINRM_PORT: "${ACC_WINRM_PORT:-5985}"
      ACC_WINRM_TRANSPORT: "${ACC_WINRM_TRANSPORT:-ntlm}"
      ACC_WINRM_SERVER_CERT_VALIDATION: "${ACC_WINRM_SERVER_CERT_VALIDATION:-validate}"
      # Métricas de rendimiento en /metricas.
      ACC_REQUEST_METRICS: "${ACC_REQUEST_METRICS:-1}"
      ACC_REQUEST_METRICS_WINDOW: "${ACC_REQUEST_METRICS_WINDOW:-500}"
      ACC_SLOW_REQUEST_MS: "${ACC_SLOW_REQUEST_MS:-1000}"
      # Menú Configuración con pestañas y panel de Módulos. Con 0 se recupera
      # el menú anterior sin tocar la base de datos (reversión de interfaz).
      ACC_UI_CONFIG_PANEL: "${ACC_UI_CONFIG_PANEL:-1}"
      # Autenticación corporativa LDAPS (los valores reales, incluida la
      # contraseña del bind, viven en .env.docker o en un secret).
      ACC_LDAP_ENABLED: "${ACC_LDAP_ENABLED:-0}"
      ACC_LDAP_URL: "${ACC_LDAP_URL:-ldaps://lds.etecsa.cu:636}"
      ACC_LDAP_BIND_DN: "${ACC_LDAP_BIND_DN:-uid=rouser,ou=Special Users,dc=etecsa,dc=cu}"
      ACC_LDAP_BIND_PASSWORD: "${ACC_LDAP_BIND_PASSWORD:-}"
      ACC_LDAP_BIND_PASSWORD_FILE: "${ACC_LDAP_BIND_PASSWORD_FILE:-}"
      ACC_LDAP_USER_BASE: "${ACC_LDAP_USER_BASE:-ou=etecsa.cu,ou=people,dc=etecsa,dc=cu}"
      ACC_LDAP_USER_FILTER: "${ACC_LDAP_USER_FILTER:-(objectClass=person)}"
      ACC_LDAP_USER_SCOPE: "${ACC_LDAP_USER_SCOPE:-onelevel}"
      ACC_LDAP_USERNAME_ATTR: "${ACC_LDAP_USERNAME_ATTR:-uid}"
      ACC_LDAP_TLS_VERIFY: "${ACC_LDAP_TLS_VERIFY:-1}"
      ACC_LDAP_TLS_CA_FILE: "${ACC_LDAP_TLS_CA_FILE:-}"
      ACC_LDAP_ALLOW_INSECURE: "${ACC_LDAP_ALLOW_INSECURE:-0}"
      ACC_LDAP_DEFAULT_ROLE: "${ACC_LDAP_DEFAULT_ROLE:-viewer}"
      ACC_BIND: 0.0.0.0:8000
      ACC_WORKERS: "1"
      ACC_GUNICORN_WORKER_CLASS: gthread
      ACC_GUNICORN_THREADS: "8"
      ACC_GUNICORN_TIMEOUT: "330"
    volumes:
      - acc_data:/data
      - acc_secrets:/secrets
      - acc_logs:/logs
      - acc_ssh:/home/acc/.ssh
      # CA del directorio para LDAPS (ACC_LDAP_TLS_CA_FILE=/certs/ca-etecsa.pem).
      - ./certs:/certs:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Planificador dedicado opcional. Con este perfil, el servicio web debe
  # correr con ACC_ROLE=web en .env para no duplicar el scheduler; el lock
  # flock de todos modos impide que dos procesos programen a la vez.
  scheduler:
    extends:
      service: app
    profiles: ["scheduler"]
    command: ["flask", "--app", "app", "scheduler"]
    environment:
      ACC_ROLE: worker
      ACC_SCHEDULER_ENABLED: "1"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: ansible-control-center-nginx:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${ACC_HTTP_PORT:-80}:80"
      - "${ACC_HTTPS_PORT:-443}:443"
    environment:
      TLS_CN: "${TLS_CN:-localhost}"
      TLS_SAN: "${TLS_SAN:-DNS:localhost,IP:127.0.0.1}"
      TLS_DAYS: "${TLS_DAYS:-825}"
    volumes:
      - ./certs:/etc/nginx/certs
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  backend:
    driver: bridge

volumes:
  acc_data:
  acc_secrets:
  acc_logs:
  acc_ssh:
