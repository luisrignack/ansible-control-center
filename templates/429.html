{% extends "base.html" %}

{% block title %}Demasiadas peticiones{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-card fade-in">
        <div class="error-icon is-warn" aria-hidden="true"><i class="bi bi-hourglass-split"></i></div>
        <div class="error-code">429</div>
        <h1 class="error-title">Demasiadas peticiones</h1>
        <p class="error-text">
            {{ message | default('Has realizado demasiadas peticiones.') }}
            Reintenta en aproximadamente {{ retry_after | default(60) }} segundo(s).
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-acento">
            <i class="bi bi-house" aria-hidden="true"></i> Volver al panel
        </a>
    </div>
</div>
{% endblock %}
