{% extends "base.html" %}

{% block title %}Error interno{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-card fade-in">
        <div class="error-icon" aria-hidden="true"><i class="bi bi-exclamation-triangle"></i></div>
        <div class="error-code">500</div>
        <h1 class="error-title">Error interno</h1>
        <p class="error-text">
            Se produjo un error interno. Revisa los logs del servidor para más detalles.
        </p>
        <a href="{{ url_for("tareas") }}" class="btn btn-acento">
            <i class="bi bi-house" aria-hidden="true"></i> Volver al panel
        </a>
    </div>
</div>
{% endblock %}
