{% extends "base.html" %}

{% block title %}Error interno{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12 col-md-6 mx-auto text-center py-5">
        <h1 class="display-4"><i class="bi bi-exclamation-triangle"></i> 500</h1>
        <p class="text-secondary">

        </a>
    </div>
</div>
{% endblock %}
