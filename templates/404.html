{% extends "base.html" %}

{% block title %}Página no encontrada{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-card fade-in">
        <div class="error-icon is-info" aria-hidden="true"><i class="bi bi-signpost-2"></i></div>
        <div class="error-code">404</div>
        <h1 class="error-title">Página no encontrada</h1>
        <p class="error-text">La página o el recurso solicitado no existe.</p>
        <a href="{{ url_for('index') }}" class="btn btn-acento">
            <i class="bi bi-house" aria-hidden="true"></i> Volver al panel
        </a>
    </div>
</div>
{% endblock %}
