{% extends "base.html" %}

{% block title %}Progreso de la ejecución{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12 col-md-8 mx-auto">
        <div class="card fade-in">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-arrow-repeat me-2"></i> Progreso</h4>
                <a href="{{ url_for('index') }}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Volver
                </a>
            </div>
            <div class="card-body">
                <div class="progress mb-3" role="progressbar" aria-label="Progreso">
                    <div id="progressBar" class="progress-bar" style="width: 0%">0%</div>
                </div>
                <p id="progressMessage" class="small text-secondary mb-3">Conectando…</p>
                <div id="batchLink" class="mb-3" style="display: none;">
                    <a class="btn btn-sm btn-acento" href="#">
                        <i class="bi bi-collection me-1"></i> Ver resultados por host
                    </a>
                </div>
                <pre id="progressLog"
                     class="small mb-0"
                     style="max-height: 300px; overflow-y: auto; white-space: pre-wrap;"></pre>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script nonce="{{ csp_nonce }}">
    const taskId = {{ task_id | tojson }};
    const progressBar = document.getElementById('progressBar');
    const progressMessage = document.getElementById('progressMessage');
    const progressLog = document.getElementById('progressLog');
    const batchLink = document.getElementById('batchLink');
    const batchLinkAnchor = batchLink.querySelector('a');

    function renderTask(task) {
        const value = Number(task.progress || 0);
        progressBar.style.width = value + '%';
        progressBar.textContent = value + '%';
        progressMessage.textContent = task.message || '';
        if (Array.isArray(task.log)) {
            progressLog.textContent = task.log.join('\n');
        }
        if (task.batch_id) {
            batchLinkAnchor.href = '/batches/' + encodeURIComponent(task.batch_id);
            batchLink.style.display = 'block';
        }
    }

    const source = new EventSource(
        `/progress/${encodeURIComponent(taskId)}/events`
    );

    source.addEventListener('progress', (event) => {
        renderTask(JSON.parse(event.data));
    });

    source.addEventListener('completed', (event) => {
        renderTask(JSON.parse(event.data));
        source.close();
    });

    source.addEventListener('timeout', (event) => {
        renderTask(JSON.parse(event.data));
        progressMessage.textContent += ' (tiempo de espera agotado)';
        source.close();
    });

    source.addEventListener('error', () => {
        // EventSource reintenta automáticamente; el servidor cierra al terminar.
    });
</script>
{% endblock %}
