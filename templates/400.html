{% extends "base.html" %}

{% block title %}Petición no válida{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12 col-md-6 mx-auto text-center py-5">
        <h1 class="display-4"><i class="bi bi-shield-exclamation"></i> 400</h1>
        <p class="text-secondary">
            {{ message | default('La petición no es válida o el token de seguridad ha caducado.') }}
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-acento">
            <i class="bi bi-arrow-clockwise me-1"></i> Volver e intentar de nuevo
        </a>
    </div>
</div>
{% endblock %}
