---
# Playbook de configuración de hora/zona horaria en Ubuntu (fase P4).
#
# Variables esperadas (se pasan con --extra-vars desde la aplicación):
#   accion:       "TZ" o "TIME"
#   valor:        zona horaria (TZ) o fecha/hora AAAA-MM-DDTHH:MM (TIME)
#   modo_hora:    "utc" (instante absoluto) o "local" (hora de pared del host)
#   valor_epoch:  epoch objetivo cuando modo_hora == "utc" (0 en modo local)
#   ntp_policy:   "keep", "off", "restore" o "configure"
#   ntp_servers:  lista de servidores NTP para la política "configure"
#   sync_rtc:     sincronizar el reloj hardware con hwclock
#   force:        aplicar aunque el estado ya coincida
#   tolerancia:   desviación máxima aceptada al verificar (segundos)
#   requiere_ntp_off: impedir TIME con NTP activo y política keep
#   local_fold:   0/1 para desambiguar una hora local repetida (DST); vacío
#   zona_horaria: zona IANA con la que se interpreta la hora local (DST)
#   ntp_settle:   segundos de espera tras reactivar NTP antes de verificar
#
# El playbook es idempotente: compara el estado inicial con el objetivo y solo
# cambia lo necesario. Al final vuelve a leer el estado y publica marcadores
# HORA_* que la aplicación interpreta.
- name: Configurar hora y zona horaria
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Validar la acción solicitada
      ansible.builtin.assert:
        that:
          - accion in ['TZ', 'TIME']
        fail_msg: "Acción no válida: {{ accion }}"
        success_msg: "Acción válida: {{ accion }}"

    - name: Validar el modo de hora
      ansible.builtin.assert:
        that:
          - modo_hora in ['utc', 'local']
        fail_msg: "Modo de hora no válido: {{ modo_hora }}"
      when: accion == 'TIME'

    - name: Validar la política NTP
      ansible.builtin.assert:
        that:
          - ntp_policy in ['keep', 'off', 'restore', 'configure']
        fail_msg: "Política NTP no válida: {{ ntp_policy }}"

    - name: Validar los servidores NTP
      ansible.builtin.assert:
        that:
          - ntp_servers | default([]) | length > 0
        fail_msg: "La política 'configure' requiere al menos un servidor NTP."
      when: ntp_policy == 'configure'

    - name: Leer el estado inicial
      ansible.builtin.import_tasks: tasks/leer_estado.yml

    - name: Guardar el estado inicial
      ansible.builtin.set_fact:
        hora_antes: "{{ hora_estado }}"
        hora_cambios: []
        hora_errores: []
        hora_advertencias: []

    - name: Impedir TIME con NTP activo y política keep
      ansible.builtin.assert:
        that:
          - not (accion == 'TIME' and ntp_policy == 'keep' and (hora_antes.ntp | bool))
        fail_msg: >-
          TIME con NTP activo y política keep: el reloj puede volver a
          sincronizarse. Usa off, restore o configure, o desactiva
          ACC_TIME_REQUIRE_NTP_OFF de forma consciente.
        success_msg: "Política de hora compatible con el estado NTP."
      when: requiere_ntp_off | default(true) | bool

    - name: Avisar de que NTP puede revertir la hora
      ansible.builtin.set_fact:
        hora_advertencias: "{{ hora_advertencias + ['TIME con NTP activo y política keep: el reloj puede volver a sincronizarse. Usa off, restore o configure.'] }}"
      when:
        - accion == 'TIME'
        - ntp_policy == 'keep'
        - hora_antes.ntp | bool

    - name: Publicar el estado inicial
      ansible.builtin.debug:
        msg: "HORA_BEFORE_B64={{ hora_antes | to_json | b64encode }}"

    # ------------------------------------------------------------------
    # Zona horaria
    # ------------------------------------------------------------------
    - name: Configurar la zona horaria
      ansible.builtin.command:
        argv: [timedatectl, set-timezone, "{{ valor }}"]
      when:
        - accion == 'TZ'
        - force | bool or (hora_antes.timezone | default('')) != valor
      register: _hora_tz_cambio
      changed_when: _hora_tz_cambio.rc == 0

    - name: Registrar el cambio de zona horaria
      ansible.builtin.set_fact:
        hora_cambios: "{{ hora_cambios + ['timezone'] }}"
      when: _hora_tz_cambio is defined and _hora_tz_cambio.changed

    # ------------------------------------------------------------------
    # NTP
    # ------------------------------------------------------------------
    - name: Comprobar si chrony está instalado
      ansible.builtin.shell: command -v chronyc
      register: _hora_chrony
      changed_when: false
      failed_when: false

    - name: Comprobar si systemd-timesyncd está disponible
      ansible.builtin.command:
        argv: [systemctl, cat, systemd-timesyncd.service]
      register: _hora_timesyncd
      changed_when: false
      failed_when: false

    - name: Verificar que hay un servicio NTP disponible
      ansible.builtin.assert:
        that:
          - _hora_chrony.rc == 0 or _hora_timesyncd.rc == 0
        fail_msg: "No se encontró chrony ni systemd-timesyncd para configurar NTP."
      when: ntp_policy == 'configure'

    - name: Desactivar NTP antes de fijar la hora
      ansible.builtin.command:
        argv: [timedatectl, set-ntp, "false"]
      when:
        - ntp_policy in ['off', 'restore', 'configure']
        - (accion == 'TIME') or (ntp_policy == 'off')
        - hora_antes.ntp | bool
      register: _hora_ntp_off
      changed_when: _hora_ntp_off.rc == 0

    - name: Registrar la desactivación de NTP
      ansible.builtin.set_fact:
        hora_cambios: "{{ hora_cambios + ['ntp_off'] }}"
      when: _hora_ntp_off is defined and _hora_ntp_off.changed

    # ------------------------------------------------------------------
    # Hora exacta
    # ------------------------------------------------------------------
    - name: Validar la hora local frente a cambios de horario (DST)
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import sys
            from datetime import datetime
            from zoneinfo import ZoneInfo

            value, timezone_name, fold = sys.argv[1], sys.argv[2], sys.argv[3]
            parsed = datetime.strptime(value, "%Y-%m-%dT%H:%M")
            tz = ZoneInfo(timezone_name)
            first = parsed.replace(tzinfo=tz, fold=0)
            second = parsed.replace(tzinfo=tz, fold=1)
            roundtrip = (
                first.astimezone(ZoneInfo("UTC"))
                .astimezone(tz)
                .replace(tzinfo=None)
            )
            if roundtrip != parsed:
                print("missing")
            elif first.utcoffset() != second.utcoffset() and fold not in ("0", "1"):
                print("ambiguous")
            else:
                print("ok")
          - "{{ valor }}"
          - "{{ zona_horaria | default(hora_antes.timezone, true) }}"
          - "{{ local_fold | default('') | string }}"
      register: _hora_dst
      changed_when: false
      failed_when: false
      when:
        - accion == 'TIME'
        - modo_hora == 'local'

    - name: Rechazar una hora local inexistente o ambigua
      ansible.builtin.assert:
        that:
          - _hora_dst.stdout | default('') | trim == 'ok'
        fail_msg: >-
          La hora {{ valor }} no es válida en
          {{ zona_horaria | default(hora_antes.timezone, true) }}:
          {{ 'no existe por el cambio de horario de verano'
             if (_hora_dst.stdout | default('') | trim) == 'missing'
             else 'es ambigua y se repite; indica la primera o la segunda ocurrencia' }}.
        success_msg: "Hora local válida en {{ zona_horaria | default(hora_antes.timezone, true) }}."
      when:
        - accion == 'TIME'
        - modo_hora == 'local'

    - name: Calcular el instante objetivo en modo local
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import sys
            from datetime import datetime
            from zoneinfo import ZoneInfo

            value, timezone_name, fold = sys.argv[1], sys.argv[2], sys.argv[3]
            parsed = datetime.strptime(value, "%Y-%m-%dT%H:%M")
            target = parsed.replace(
                tzinfo=ZoneInfo(timezone_name), fold=int(fold or 0)
            )
            print(int(target.timestamp()))
          - "{{ valor }}"
          - "{{ zona_horaria | default(hora_antes.timezone, true) }}"
          - "{{ local_fold | default('0') | string }}"
      register: _hora_objetivo_local
      when:
        - accion == 'TIME'
        - modo_hora == 'local'
      changed_when: false

    - name: Calcular el instante objetivo
      ansible.builtin.set_fact:
        # La aplicación calcula el epoch con zoneinfo y lo envía en
        # ``valor_epoch`` para que vista previa y ejecución coincidan. Solo se
        # recalcula en el host si no llegó ningún valor (compatibilidad).
        hora_objetivo_epoch: >-
          {{ (valor_epoch | int) if (valor_epoch | int) != 0
             else ((_hora_objetivo_local.stdout | trim | int) if modo_hora == 'local' else 0) }}
      when: accion == 'TIME'

    - name: Fijar la hora exacta
      ansible.builtin.command:
        argv: [date, -s, "@{{ hora_objetivo_epoch }}"]
      when:
        - accion == 'TIME'
        - force | bool or (((hora_antes.epoch | int) - (hora_objetivo_epoch | int)) | abs) > (tolerancia | int)
      register: _hora_time_cambio
      changed_when: _hora_time_cambio.rc == 0

    - name: Registrar el cambio de hora
      ansible.builtin.set_fact:
        hora_cambios: "{{ hora_cambios + ['time'] }}"
      when: _hora_time_cambio is defined and _hora_time_cambio.changed

    # ------------------------------------------------------------------
    # Reloj hardware
    # ------------------------------------------------------------------
    - name: Sincronizar el reloj hardware
      ansible.builtin.command:
        argv: [hwclock, --systohc]
      when: sync_rtc | bool
      register: _hora_rtc_sync
      changed_when: _hora_rtc_sync.rc == 0
      failed_when: false

    - name: Avisar si no se pudo sincronizar el RTC
      ansible.builtin.set_fact:
        hora_advertencias: "{{ hora_advertencias + ['No se pudo sincronizar el reloj hardware (hwclock)'] }}"
      when:
        - sync_rtc | bool
        - _hora_rtc_sync.rc != 0

    # Verificación intermedia: comprueba la hora antes de reactivar NTP. Si
    # NTP corrige el reloj justo después, la verificación final también debe
    # pasar; así no se reporta éxito por una lectura intermedia engañosa.
    - name: Leer el estado tras fijar la hora (antes de reactivar NTP)
      ansible.builtin.import_tasks: tasks/leer_estado.yml
      when: accion == 'TIME'

    - name: Verificar la hora antes de reactivar NTP
      ansible.builtin.set_fact:
        hora_errores: "{{ hora_errores + ['Desviación intermedia de ' ~ (((hora_estado.epoch | int) - (hora_objetivo_epoch | int)) | abs) ~ 's (tolerancia ' ~ tolerancia ~ 's)'] }}"
      when:
        - accion == 'TIME'
        - (((hora_estado.epoch | int) - (hora_objetivo_epoch | default(0) | int)) | abs) > (tolerancia | int)

    # ------------------------------------------------------------------
    # Servidores NTP
    # ------------------------------------------------------------------
    - name: Crear el directorio de configuración de chrony
      ansible.builtin.file:
        path: /etc/chrony/conf.d
        state: directory
        mode: "0755"
      when:
        - ntp_policy == 'configure'
        - _hora_chrony.rc == 0

    - name: Configurar servidores NTP en chrony
      ansible.builtin.copy:
        dest: /etc/chrony/conf.d/90-ansible-control-center.conf
        content: |
          {% for servidor in ntp_servers | default([]) %}
          server {{ servidor }} iburst
          {% endfor %}
        mode: "0644"
      when:
        - ntp_policy == 'configure'
        - _hora_chrony.rc == 0
      register: _hora_ntp_chrony
      notify: Reiniciar chrony

    - name: Crear el directorio de configuración de timesyncd
      ansible.builtin.file:
        path: /etc/systemd/timesyncd.conf.d
        state: directory
        mode: "0755"
      when:
        - ntp_policy == 'configure'
        - _hora_chrony.rc != 0

    - name: Configurar servidores NTP en systemd-timesyncd
      ansible.builtin.copy:
        dest: /etc/systemd/timesyncd.conf.d/90-ansible-control-center.conf
        content: |
          [Time]
          NTP={{ ntp_servers | default([]) | join(' ') }}
        mode: "0644"
      when:
        - ntp_policy == 'configure'
        - _hora_chrony.rc != 0
      register: _hora_ntp_timesyncd
      notify: Reiniciar systemd-timesyncd

    - name: Reactivar NTP
      ansible.builtin.command:
        argv: [timedatectl, set-ntp, "true"]
      when:
        - ntp_policy == 'configure' or
          (ntp_policy == 'restore' and _hora_ntp_off is defined and
           _hora_ntp_off.changed)
      register: _hora_ntp_on
      changed_when: _hora_ntp_on.rc == 0

    - name: Registrar la reactivación de NTP
      ansible.builtin.set_fact:
        hora_cambios: "{{ hora_cambios + ['ntp_on'] }}"
      when: _hora_ntp_on is defined and _hora_ntp_on.changed

    - name: Esperar a que NTP se estabilice
      ansible.builtin.command:
        argv: [sleep, "{{ ntp_settle | default(0) | int }}"]
      when:
        - ntp_settle | default(0) | int > 0
        - _hora_ntp_on is defined and _hora_ntp_on.changed
      changed_when: false

    # ------------------------------------------------------------------
    # Verificación posterior
    # ------------------------------------------------------------------
    - name: Leer el estado final
      ansible.builtin.import_tasks: tasks/leer_estado.yml

    - name: Guardar el estado final
      ansible.builtin.set_fact:
        hora_despues: "{{ hora_estado }}"

    - name: Verificar la zona horaria
      ansible.builtin.set_fact:
        hora_errores: "{{ hora_errores + ['Zona horaria esperada ' ~ valor ~ ', obtenida ' ~ (hora_despues.timezone | default(''))] }}"
      when:
        - accion == 'TZ'
        - (hora_despues.timezone | default('')) != valor

    - name: Calcular la desviación de la hora
      ansible.builtin.set_fact:
        hora_desviacion: "{{ ((hora_despues.epoch | int) - (hora_objetivo_epoch | int)) | abs }}"
      when: accion == 'TIME'

    - name: Verificar la hora exacta
      ansible.builtin.set_fact:
        hora_errores: "{{ hora_errores + ['Desviación de ' ~ hora_desviacion ~ 's (tolerancia ' ~ tolerancia ~ 's)'] }}"
      when:
        - accion == 'TIME'
        - (hora_desviacion | int) > (tolerancia | int)

    - name: Verificar que NTP quedó desactivado
      ansible.builtin.set_fact:
        hora_errores: "{{ hora_errores + ['NTP sigue activo'] }}"
      when:
        - ntp_policy == 'off'
        - hora_despues.ntp | bool

    - name: Verificar que NTP quedó activado
      ansible.builtin.set_fact:
        hora_errores: "{{ hora_errores + ['NTP no está activo'] }}"
      when:
        - ntp_policy == 'configure' or
          (ntp_policy == 'restore' and hora_antes.ntp | bool)
        - not (hora_despues.ntp | bool)

    - name: Verificar que NTP quedó desactivado al restaurar
      ansible.builtin.set_fact:
        hora_errores: "{{ hora_errores + ['NTP debía seguir desactivado (restore)'] }}"
      when:
        - ntp_policy == 'restore'
        - not (hora_antes.ntp | bool)
        - hora_despues.ntp | bool

    - name: Publicar el estado final
      ansible.builtin.debug:
        msg: "HORA_STATE_B64={{ hora_despues | to_json | b64encode }}"

    - name: Publicar si hubo cambios
      ansible.builtin.debug:
        msg: "HORA_CHANGED={{ 'true' if hora_cambios | length > 0 else 'false' }}"

    - name: Publicar si la verificación fue correcta
      ansible.builtin.debug:
        msg: "HORA_VERIFIED={{ 'true' if hora_errores | length == 0 else 'false' }}"

    - name: Publicar los errores de verificación
      ansible.builtin.debug:
        msg: "HORA_ERRORS_B64={{ (hora_errores | join(' | ')) | b64encode }}"

    - name: Publicar las advertencias
      ansible.builtin.debug:
        msg: "HORA_WARNINGS_B64={{ (hora_advertencias | join(' | ')) | b64encode }}"

    - name: Publicar la desviación
      ansible.builtin.debug:
        msg: "HORA_DEVIATION={{ hora_desviacion | default('') }}"

  handlers:
    - name: Reiniciar chrony
      ansible.builtin.service:
        name: chrony
        state: restarted

    - name: Reiniciar systemd-timesyncd
      ansible.builtin.service:
        name: systemd-timesyncd
        state: restarted
