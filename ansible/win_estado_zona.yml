---
# Playbook de inspección para hosts Windows (conexión WinRM).
#
# Salida esperada en stdout (igual que el de Linux, pero solo zona):
#   HORA_STATE_B64=<base64 del JSON de estado>
#
# Solo módulos builtin (``raw``) para no depender de la colección
# ansible.windows. ``estado_hora`` de Linux lee epoch/NTP/RTC, que en Windows
# requieren PowerShell y WMI; en esta fase la inspección Windows publica solo
# la zona horaria, suficiente para la vista previa de la acción TZ.
- name: Inspeccionar la zona horaria (Windows)
  hosts: all
  become: false
  gather_facts: false

  tasks:
    - name: Leer la zona horaria actual (tzutil)
      ansible.builtin.raw: tzutil /g
      register: _win_tz_actual
      changed_when: false

    - name: Guardar la zona leída
      ansible.builtin.set_fact:
        zona_actual: "{{ _win_tz_actual.stdout | trim }}"

    - name: Publicar el estado (HORA_STATE)
      ansible.builtin.debug:
        msg: >-
          HORA_STATE_B64={{ {'timezone': zona_actual}
          | to_json | b64encode }}
